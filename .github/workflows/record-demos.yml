# Re-records the "Can I Fish This?" card's desktop and phone screen recordings
# from the live site (scripts/record-demos.mjs) and commits them.
#
# - Run it by hand: Actions → Record demos → Run workflow. On the default branch
#   it opens a pull request with the new recordings; on any other branch it
#   commits to that branch.
# - It also runs on the first of each month, and on pull requests that change
#   the recorder, committing the recordings to the pull request's branch.
name: Record demos

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 1 * *'
  pull_request:
    paths:
      - scripts/record-demos.mjs
      - .github/workflows/record-demos.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: record-demos-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  record:
    # Pull requests from forks can't push back, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and ffmpeg
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg

      - name: Record
        env:
          # "Name: value" header that a Cloudflare WAF rule lets past the bot check (see README.md).
          DEMO_HEADER: ${{ secrets.DEMO_HEADER }}
        run: node scripts/record-demos.mjs

      - name: Keep the recordings (or, on failure, screenshots) as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-recordings
          if-no-files-found: ignore
          path: |
            public/assets/projects/bc-fishing-regulations/*-demo*.webp
            record-demos-debug/

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          git add public/assets/projects/bc-fishing-regulations/
          if git diff --cached --quiet; then echo "Recordings unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Re-record the Can I Fish This? demos from canifishthis.ca"
          if [ "$BRANCH" = "$DEFAULT" ]; then
            NEW="demo-recordings-${{ github.run_id }}"
            git push origin "HEAD:refs/heads/$NEW"
            gh pr create --base "$DEFAULT" --head "$NEW" \
              --title "Re-recorded Can I Fish This? demos" \
              --body "Fresh desktop and phone recordings of canifishthis.ca from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Check the preview, then merge." \
              || echo "Pushed $NEW; open a pull request from it (Actions may not be allowed to create pull requests in this repository)."
          else
            git push origin "HEAD:$BRANCH"
          fi
