# Temporary: screenshots in WebKit, committed back to this branch.
name: Safari check
on:
  push:
    branches: [claude/safari-check]
    paths-ignore: ['ci-safari/shots/**']
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps webkit
      - run: |
          (cd dist && python3 -m http.server 4400 >/dev/null 2>&1 &)
          sleep 2
          node ci-safari/shoot.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-safari/shots && git commit -m "WebKit screenshots" && git push origin HEAD:claude/safari-check
