# Temporary: checks what the live resume generator serves.
name: Safari check
on:
  push:
    branches: [claude/safari-check]
    paths-ignore: ['ci-live/out.txt']
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
            for base in https://dawsonhorvath.com https://personal-website.horvath-dawson.workers.dev; do
              echo "== $base"; curl -sSL -D - -o page.html "$base/?v=$RANDOM" | grep -iE '^(HTTP|cf-cache|age|cache-control)'
              for js in $(grep -oE '/assets/[A-Za-z0-9_.-]+\.js' page.html | sort -u); do
                curl -sSL "$base$js" -o a.js; echo "$js bezel-fix=$(grep -c '\.2579' a.js)"
              done
            done
          } > ci-live/out.txt 2>&1
          cat ci-live/out.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-live && git commit -m "Live check" && git push origin HEAD:claude/safari-check
