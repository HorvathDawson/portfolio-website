# ============================================================
# A40 build constants: the single source of truth for the numbers
# ------------------------------------------------------------
# INPUTS ONLY. Everything computed from these (track from hub face
# and ET, tyre OD, corner masses, wheel/spring rates, roll stiffness,
# damping, rpm table, U-joint angles, ...) lives in
# scripts/a40_constants.py; the kinematic results (motion ratio,
# roll centre, roll angles, scrub/trail, ...) come from
# scripts/plot_geometry_reference.py. Both end up in
# src/blog/a40-constants.generated.json, which the posts and the
# roadmap read.
#
# Each entry:
#   key:                  # snake_case, used in posts as {{key}}
#     value: 1234         # number (or a string for names like a tyre size)
#     unit: mm            # mm, kg, Hz, N/mm, deg, in, %, g, ... ("" for none)
#     status: working     # locked | working | target | open | measure
#     note: "why / where it comes from / how to measure it"
#     decimals: 1         # optional: decimals shown (default: as written)
#     label: "Front track" # optional: human name
#
# How to add a constant:
#   1. Add the entry below (inputs only; if it can be computed from
#      other entries, add the formula to derive() in
#      scripts/a40_constants.py instead).
#   2. Run `npm run constants` (regenerates the JSON, ~10 s;
#      `python3 scripts/plot_geometry_reference.py` also redraws the
#      plots, ~1 min). Commit the YAML, the JSON and any plots together.
#   3. Use it in a post: {{key}} gives the formatted value with unit
#      ("1234 mm"), {{key:raw}} the number alone ("1234"). Modifiers:
#      {{key:1}} = 1 decimal, {{key:r10}} = rounded to the nearest 10;
#      they combine ({{key:raw:r10}}). In the roadmap use k('key') /
#      raw('key') from src/blog/a40Constants.ts.
#   4. `npm run build` fails on an unknown {{name}} (it names the post)
#      and when the JSON is stale relative to this file.
#
# Tables for the build-constants post are at the end (`tables:`): each
# row's value and note are templates over the constants, and the
# status column comes from the first constant in the value unless the
# row sets one. The post includes them as {{table:<name>}}.
# ============================================================

constants:

  # ── Mass ────────────────────────────────────────────────
  operating_mass:
    value: 950
    unit: kg
    status: working
    label: Operating mass (driver + full tank)
    note: Sum of the mass table in build-constants. Corner-weigh when rolling.
  driver_mass:
    value: 75
    unit: kg
    status: working
    note: Curb mass = operating mass minus the driver.
  fuel_mass:
    value: 25
    unit: kg
    status: working
    note: Stock-size ~30-35 L tank, full. Verify the tank.
  front_weight_fraction:
    value: 55
    unit: "%"
    status: working
    note: Static front share. Estimate; corner-weigh once rolling.
  unsprung_front:
    value: 30
    unit: kg
    status: working
    note: Per corner. Miata corner + 205/65R15 + half the arms.
  unsprung_rear:
    value: 33
    unit: kg
    status: working
    note: Per corner. As the front plus half a half-shaft. Diff, subframe and inner half-shaft are sprung.
  cg_height:
    value: 575
    unit: mm
    status: working
    note: Miata 460 mm + ~115 mm for the taller body and seating. Refine from CAD.
  cg_height_tol:
    value: 50
    unit: mm
    status: working
    note: CG band used for sensitivity (525-625 mm).
  cg_height_miata:
    value: 460
    unit: mm
    status: working
    note: Donor NA Miata CG height (published estimate).

  # ── Body and wheelbase ──────────────────────────────────
  wheelbase:
    value: 2350
    unit: mm
    status: locked
    note: Stock A40 Devon.
  wheelbase_miata:
    value: 2265
    unit: mm
    status: locked
    note: NA Miata (published). Sets the stock knuckle Ackermann angle.
  a40_stock_track:
    value: 1232
    unit: mm
    status: locked
    note: Stock A40 Devon front track (published).
  a40_stock_tyre_width:
    value: 133
    unit: mm
    status: locked
    note: Stock 5.25-16 crossply section width.

  # ── Front: donor and narrowing ──────────────────────────
  front_track_miata:
    value: 1420
    unit: mm
    status: measure
    note: Donor NA front track at ET40. Published 1405-1425; 1420 matches the scan. Measure the donor hub-face width.
  et_miata:
    value: 40
    unit: mm
    status: locked
    note: NA Miata wheel offset (published). Hub face sits ET outboard of the wheel centreline.
  front_narrowing:
    value: 95
    unit: mm
    status: locked
    note: Every front inboard pickup moves this far inboard per side; hub face moves by the same amount.
  hub_z_miata:
    value: 265
    unit: mm
    status: working
    note: Loaded hub-centre height on the donor (estimate used by the scrub/trail and RC model).

  # ── Wheels and tyres ────────────────────────────────────
  wheel_et:
    value: 38
    unit: mm
    status: locked
    note: 15x6, 4x100 wheels on hand.
  wheel_diameter:
    value: 15
    unit: in
    status: locked
    note: Rim diameter, all four corners.
  tyre_width:
    value: 205
    unit: mm
    status: locked
    note: 205/65R15 all round.
  tyre_aspect:
    value: 65
    unit: "%"
    status: locked
    note: Sidewall height / width.
  tyre_width_miata:
    value: 185
    unit: mm
    status: locked
    note: Donor tyre 185/60R14.
  tyre_aspect_miata:
    value: 60
    unit: "%"
    status: locked
    note: Donor tyre 185/60R14.
  wheel_diameter_miata:
    value: 14
    unit: in
    status: locked
    note: Donor tyre 185/60R14.

  # ── Rear ────────────────────────────────────────────────
  rear_track:
    value: 1340
    unit: mm
    status: locked
    note: Tyre CL to tyre CL, from the rear scan with the ET38 wheels.
  rear_track_miata:
    value: 1420
    unit: mm
    status: measure
    note: Donor NA rear track as published. Measure hub face to hub face on the donor.
  rear_et_miata_lo:
    value: 40
    unit: mm
    status: measure
    note: If the published donor rear track is quoted at ET40.
  rear_et_miata_hi:
    value: 45
    unit: mm
    status: measure
    note: If the published donor rear track is quoted at ET45.

  # ── Front shock ─────────────────────────────────────────
  shock_angle:
    value: 80
    unit: deg
    status: working
    note: Front shock angle to the LCA at the lower mount. Sets the motion ratio; lock with the shock-tower position.
  shock_stroke:
    value: 127
    unit: mm
    status: working
    note: 5 in stroke, until the shock is chosen.
  shock_bump_fraction:
    value: 45
    unit: "%"
    status: working
    note: Share of the stroke in bump at ride height (assumed, about the stock Miata split).
  shock_length_ride:
    value: 330
    unit: mm
    status: working
    note: Eye-to-eye at ride height (assumed). Only affects how MR drifts through travel.
  miata_wheel_travel_lo:
    value: 155
    unit: mm
    status: working
    note: Stock NA front wheel travel, bump + droop (70-75 + 85-90 mm), low end.
  miata_wheel_travel_hi:
    value: 165
    unit: mm
    status: working
    note: Stock NA front wheel travel, high end.

  # ── Ride ────────────────────────────────────────────────
  ride_freq_front:
    value: 1.4
    unit: Hz
    status: target
    note: Front ride frequency. Springs are specified as wheel rates from this.
  ride_freq_rear:
    value: 1.5
    unit: Hz
    status: target
    note: 0.1 Hz above the front so the body heaves flat instead of pitching.
  ride_freq_front_lo:
    value: 1.2
    unit: Hz
    status: target
    note: Street band, front.
  ride_freq_front_hi:
    value: 1.6
    unit: Hz
    status: target
    note: Street band, front.
  ride_freq_rear_lo:
    value: 1.3
    unit: Hz
    status: target
    note: Street band, rear.
  ride_freq_rear_hi:
    value: 1.7
    unit: Hz
    status: target
    note: Street band, rear.
  rear_mr_lo:
    value: 0.65
    unit: ""
    status: measure
    note: Rear motion ratio sensitivity case. Measure on the donor (shock travel vs wheel travel).
  rear_mr_mid:
    value: 0.75
    unit: ""
    status: measure
    note: Rear motion ratio sensitivity case.
  rear_mr_hi:
    value: 0.85
    unit: ""
    status: measure
    note: Rear motion ratio sensitivity case.

  # ── Roll ────────────────────────────────────────────────
  rear_rc_lo:
    value: 80
    unit: mm
    status: measure
    note: Rear roll centre, low end of the assumed band. Model or measure the narrowed Miata rear.
  rear_rc_nom:
    value: 100
    unit: mm
    status: measure
    note: Rear roll centre used where one number is needed.
  rear_rc_hi:
    value: 150
    unit: mm
    status: measure
    note: Rear roll centre, high end of the assumed band.
  lateral_accel:
    value: 0.8
    unit: g
    status: target
    note: Load case for roll and weight transfer.
  roll_target_lo:
    value: 3
    unit: deg
    status: target
    note: Body roll target at the load case, low end.
  roll_target_nom:
    value: 3.5
    unit: deg
    status: target
    note: Body roll target used where one number is needed.
  roll_target_hi:
    value: 4
    unit: deg
    status: target
    note: Body roll target, high end.
  lltd_offset_lo:
    value: 3
    unit: "%"
    status: target
    note: Start LLTD this far above the front static weight fraction.
  lltd_offset_hi:
    value: 5
    unit: "%"
    status: target
    note: Upper end of the LLTD start offset.
  arb_ir_miata:
    value: 1.977
    unit: ""
    status: working
    note: ARB installation ratio on the Miata, back-calculated from "stock 19 mm bar adds ~10 kN·m/rad" (unsourced). Measure the end-link geometry.
  arb_length:
    value: 400
    unit: mm
    status: working
    note: ARB effective torsional length (placeholder).
  steel_shear_modulus:
    value: 80
    unit: GPa
    status: locked
    note: Steel, for bar stiffness.

  # ── Damping and alignment targets ───────────────────────
  damping_ride_lo:
    value: 0.3
    unit: ""
    status: target
    note: Ride damping ratio, low end.
  damping_ride_hi:
    value: 0.4
    unit: ""
    status: target
    note: Ride damping ratio, high end.
  road_input:
    value: 20
    unit: mm
    status: working
    note: Road bump amplitude for the front bump-travel budget (assumed).
  damping_roll_lo:
    value: 0.4
    unit: ""
    status: target
    note: Roll damping ratio, low end.
  damping_roll_hi:
    value: 0.5
    unit: ""
    status: target
    note: Roll damping ratio, high end.
  caster_target_lo:
    value: 4
    unit: deg
    status: target
    note: Realistic caster target with about ±2° of adjustment from the scanned 3.62°.
  caster_target_hi:
    value: 5.5
    unit: deg
    status: target
    note: Upper end of the caster target.

  # ── Steering ────────────────────────────────────────────
  lock_loss_lo:
    value: 12
    unit: deg
    status: working
    note: Steering lock lost to body/tyre clearance vs the Miata, low end. Measure on the jig.
  lock_loss_hi:
    value: 18
    unit: deg
    status: working
    note: Steering lock lost, high end.
  turning_circle_miata:
    value: 9.4
    unit: m
    status: working
    note: NA Miata kerb-to-kerb turning circle (published, ~4.7 m radius).

  # ── Drivetrain ──────────────────────────────────────────
  final_drive:
    value: 4.44
    unit: ""
    status: measure
    note: Stock RX-8 6-speed final drive. Verify on the unit bought; the ratio is an open decision.
  final_drive_alt1:
    value: 4.10
    unit: ""
    decimals: 2
    status: open
    note: Alternative ratio for the rpm table.
  final_drive_alt2:
    value: 3.91
    unit: ""
    status: open
    note: Alternative ratio for the rpm table.
  gear_5th:
    value: 1.000
    unit: ""
    decimals: 3
    status: working
    note: CD009 5th gear (1:1).
  gear_6th:
    value: 0.794
    unit: ""
    status: working
    note: CD009 6th gear.
  gear_z32_top:
    value: 0.759
    unit: ""
    status: working
    note: Z32 5-speed 5th gear (published; 4th is 1:1). Verify on the unit if the Z32 is the one bought.
  reference_speed:
    value: 100
    unit: km/h
    status: target
    note: Cruise speed for the rpm table.
  engine_angle:
    value: 3
    unit: deg
    status: target
    note: Engine/gearbox down at the rear (tail-down).
  pinion_angle:
    value: 3
    unit: deg
    status: target
    note: RX-8 pinion nose-up, parallel to the gearbox.
  shaft_drop:
    value: 3.5
    unit: in
    status: working
    note: Driveshaft vertical drop, gearbox output to pinion. Measure on the jig.
  shaft_length:
    value: 37
    unit: in
    status: working
    note: Driveshaft centre-to-centre run. Measure on the jig.

# ============================================================
# Tables for content/a40/build-constants.md ({{table:<name>}}).
# value/note are templates over the constants above and the derived
# values; status comes from the first {{constant}} in `value` unless
# set here.
# ============================================================
tables:
  vehicle:
    - label: Operating mass (driver + full tank)
      value: "~{{operating_mass}}"
      note: Sum of the mass table below.
    - label: Curb mass (no driver)
      value: "~{{curb_mass}}"
      note: ""
    - label: Weight distribution F/R
      value: "~{{front_weight_fraction:raw}}/{{rear_weight_fraction:raw}}"
      note: Estimate; corner-weigh once rolling.
    - label: Unsprung mass per corner
      value: "~{{unsprung_front}} front, ~{{unsprung_rear}} rear"
      note: Miata corner + {{tyre_size}} + half the arms; rear adds half a half-shaft.
    - label: Sprung mass
      value: "~{{sprung_mass:r5}}"
      note: Operating mass minus unsprung. Diff and rear subframe are sprung.
    - label: Sprung corner mass
      value: "~{{corner_mass_front}} front, ~{{corner_mass_rear}} rear"
      note: Drives spring rates.
    - label: CG height
      value: "{{cg_height}} ±{{cg_height_tol:raw}}"
      note: Miata {{cg_height_miata}} + ~{{cg_height_miata_delta}} for the taller body and seating. Refine from CAD (below).
    - label: Wheelbase
      value: "{{wheelbase}}"
      note: Stock A40 Devon.
  wheels:
    - label: Front narrowing
      value: "{{front_narrowing:raw}} mm per side"
      note: Hub face moves from {{front_hub_face_miata:raw}} to {{front_hub_face}} from centreline. Rack cut {{rack_narrowing}} total.
    - label: Front track
      value: "~{{front_track_nominal}} ({{front_track:raw}} at ET{{wheel_et:raw}})"
      note: "Track = 2 × (hub face − ET). Stock A40 is {{a40_stock_track}}. Donor baseline (1405 published vs {{front_track_miata:raw}} used) is unverified: measure the donor hub faces."
    - label: Rear track
      value: "{{rear_track}}"
      note: Narrowed Miata rear, hub face {{rear_hub_face}} from centreline.
    - label: Rear narrowing
      value: "~{{rear_narrowing_lo:raw}}–{{rear_narrowing_hi:raw}} mm per side"
      note: Stock rear hub-face distance − {{rear_hub_face}}. See [rear suspension](./rear-suspension).
    - label: Tyre
      value: "{{tyre_size}}, OD {{tyre_od}}"
      note: Same front and rear.
    - label: Wheel
      value: "{{wheel_diameter}}, 4x100, ET{{wheel_et:raw}}"
      note: On hand. Miata donor baseline is ET{{et_miata:raw}}.
    - label: Tyre outer-to-outer (front)
      value: "~{{tyre_outer_front}}"
      note: "{{front_track_nominal:raw}} + {{tyre_width:raw}}. Stock A40 is {{a40_stock_track:raw}} + {{a40_stock_tyre_width:raw}} = {{a40_stock_outer}}, so the tyres sit **~{{tyre_poke}}/side** further out than stock ({{tyre_poke_exact:raw}} at the exact {{front_track}} track). Main fitment risk; check against the body scan. See [narrowing analysis](./narrowing-analysis)."
  suspension:
    - label: Front
      value: Narrowed Miata NA double wishbone
      status: locked
      note: "Narrowed pivots: LCA {{lca_pivot}}, UCA {{uca_pivot:0}} from centreline."
    - label: Rear
      value: Narrowed Miata NA independent rear
      status: decided
      note: Replaces the Ford 9" / four-link plan (Oct 2026).
    - label: Front motion ratio
      value: "{{front_mr}}"
      note: "{{shock_angle}} shock ({{front_mr_vertical}} vertical), from the front-view instant centre. See the [geometry reference](./geometry-design-reference)."
    - label: Rear motion ratio
      value: TBD
      status: measure
      note: "Measure on the donor. Rear spring = {{kw_rear:raw}} / MR²: {{spring_rear_lo:raw:0}} / {{spring_rear_mid:raw:0}} / {{spring_rear_hi:0}} at MR {{rear_mr_lo}} / {{rear_mr_mid}} / {{rear_mr_hi}}."
    - label: Wheel rate target, front
      value: "{{kw_front}} ({{ride_freq_front}}), range {{kw_front_lo:raw}}–{{kw_front_hi:raw}}"
      note: Spring rate = wheel rate ÷ MR² = ≈{{spring_front:0}} ({{spring_front:raw}}, ~{{spring_front_lbin:r10}}) at MR {{front_mr}}.
    - label: Wheel rate target, rear
      value: "{{kw_rear}} ({{ride_freq_rear}}), range {{kw_rear_lo:raw}}–{{kw_rear_hi:raw}}"
      note: Rear ~0.1 Hz above front.
    - label: Front wheel travel
      value: "{{travel_bump:raw}} mm bump / {{travel_droop}} droop"
      note: "{{shock_stroke}} stroke, {{shock_bump_fraction}} in bump (assumed). Stock Miata travel needs a ~{{stroke_for_stock_travel_lo:raw}}–{{stroke_for_stock_travel_hi}} stroke."
    - label: Front roll centre
      value: "{{rc_front}}"
      note: Kinematic, static ride height (Miata {{rc_miata:raw}}).
    - label: Rear roll centre
      value: "{{rear_rc_lo:raw}}–{{rear_rc_hi}} assumed"
      note: Narrowed Miata rear; model or measure.
    - label: Spring roll stiffness
      value: "{{roll_stiffness_front:raw}} F + {{roll_stiffness_rear:raw}} R = {{roll_stiffness_total}}"
      note: $K_w T^2/2$.
    - label: Springs-only roll at {{lateral_accel}}
      value: "{{roll_springs_rc_hi:raw}} / {{roll_springs_rc_nom:raw}} / {{roll_springs_rc_lo}}"
      note: "At rear RC {{rear_rc_hi:raw}} / {{rear_rc_nom:raw}} / {{rear_rc_lo}}. Anti-roll bars must add {{arb_add_min:raw}}–{{arb_add_max:raw:0}} kN·m/rad for {{roll_target_lo:raw}}–{{roll_target_hi}} ({{arb_add_rc_nom_nom:raw}} for {{roll_target_nom}} at rear RC {{rear_rc_nom:raw}}). See [suspension tuning](./suspension-tuning)."
  drivetrain:
    - label: Engine
      value: SR20DET
      status: locked
      note: Mounted {{engine_angle}} down at the rear (tail-down).
    - label: Transmission
      value: CD009 or Z32 (Nissan 6-/5-speed)
      status: decided shortlist
      note: OEM 5-speed rejected. Remote shifter expected. See the roadmap.
    - label: Differential
      value: Mazda RX-8 rear diff
      status: decided
      note: Custom mounts. Final drive ~{{final_drive}} stock (verify); ratio open.
    - label: Half-shafts
      value: Custom length
      status: to order
      note: RX-8 flanges to Miata hubs.
    - label: Driveshaft
      value: One-piece, 1330 joints
      status: to order
      note: "{{shaft_angle}} shaft angle, {{ujoint_front}} per joint, pinion parallel to the gearbox."
